version: 2
updates:
  # pnpm workspace (root + apps/* + packages/*, including the pnpm catalog)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # Group minor/patch bumps into one PR to avoid PR spam;
    # major version bumps stay individual for review.
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # @vercel/otel (2.3.0) only supports the OpenTelemetry JS 2.x line:
      # api <1.10, SDK 2.x, experimental packages 0.2xx. Drop this block once
      # a @vercel/otel release accepts OTel 3 (sdk 3.x / 0.3xx / api 1.10).
      - dependency-name: "@opentelemetry/api"
        versions: [">=1.10.0"]
      - dependency-name: "@opentelemetry/*"
        versions: [">=3.0.0", ">=0.300.0 <1.0.0"]
      # TypeScript 7 ships only the native compiler, without the JS API that
      # typescript-eslint / eslint-config-next load, so `eslint` crashes.
      # Drop once typescript-eslint supports TS 7.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
      # Keep Node types on the runtime's major (Vercel: Node 24.x, see engines).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"

  # Workflow actions (.github/workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
