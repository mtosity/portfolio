version: 2
updates:
  # pnpm workspace (root + apps/* + packages/*, including the pnpm catalog)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # Group minor/patch bumps into one PR to avoid PR spam;
    # major version bumps stay individual for review.
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # @vercel/otel (2.3.0) only supports the OpenTelemetry JS 2.x line:
      # api <1.10, SDK 2.x, experimental packages 0.2xx. Drop this block once
      # a @vercel/otel release accepts OTel 3 (sdk 3.x / 0.3xx / api 1.10).
      - dependency-name: "@opentelemetry/api"
        versions: [">=1.10.0"]
      - dependency-name: "@opentelemetry/*"
        versions: [">=3.0.0", ">=0.300.0 <1.0.0"]
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"

  # Workflow actions (.github/workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
