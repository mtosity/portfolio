packages:
  - apps/*
  - packages/*

# pnpm 11 requires an explicit build-script decision. These match the
# pnpm 10 behavior on main (scripts were never run; sharp/onnxruntime ship
# prebuilt binaries, so no native build is needed).
allowBuilds:
  '@parcel/watcher': false
  onnxruntime-node: false
  protobufjs: false
  sharp: false

# Single source of truth for versions shared across workspace packages.
catalog:
  next: 16.4.1
  react: ^19.2.0
  react-dom: ^19.2.0
  "@types/react": ^19.2.0
  "@types/react-dom": ^19.2.0
  typescript: ^6.0.0
  framer-motion: ^12.0.0
  sass: ^1.80.1
  eslint: ^9.0.0
  eslint-config-next: 16.4.1

# Security floors for transitive deps (Oct 2026 audit). Each selector stays
# within the vulnerable major so nothing is pushed across a breaking change.
overrides:
  '@auth/core@<0.41.3': ^0.41.3
  sharp@<0.35.5: ^0.35.5
  picomatch@<2.3.2: ^2.3.2
  protobufjs@>=7.0.0 <7.6.5: ^7.6.5
  undici@>=6.0.0 <6.28.1: ^6.28.1
  adm-zip@<0.6.1: ^0.6.1
  brace-expansion@<1.1.21: ^1.1.21
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  postcss@<8.5.23: ^8.5.23
  nanoid@<3.3.18: ^3.3.18
  browserslist@<4.28.7: ^4.28.7
  immutable@>=5.0.0 <5.1.8: ^5.1.8
  source-map-js@<1.2.2: ^1.2.2
  prosemirror-view@<1.42.3: ^1.42.3
